name: Feature request
description: An idea that would help a lab
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you have in the lab?
      description: Describe the situation first, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like LabDesk to do?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you manage today?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real patient data.
          required: true
