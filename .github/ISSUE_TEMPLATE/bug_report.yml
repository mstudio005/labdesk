name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not post real patient data**: no names, phone numbers, reports, screenshots of real reports or database files. Use made-up data.
  - type: input
    id: version
    attributes:
      label: LabDesk version
      description: Settings > About shows it.
      placeholder: "0.1.8"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, one by one, from the screen you started on.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Copy any message exactly as it appears.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional)
      description: Settings > Help > SAVE A PROBLEM REPORT makes a small file with no patient data. Paste its text here.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real patient data.
          required: true
