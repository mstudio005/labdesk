name: Build Windows installer

# Make a release: push a tag such as v0.1.1 (git tag v0.1.1 && git push origin v0.1.1).
# Or run it by hand from the Actions tab to get the installer as a download without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Put the tag's version number into the program
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$v\"/" Cargo.toml
          grep -n '^version' Cargo.toml

      - name: Check the rules and the database (no screen needed)
        run: cargo test -p labdesk-core --release

      - name: Build labdesk.exe
        run: cargo build -p labdesk-desktop --release

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Get SumatraPDF (prints reports straight to the printer)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras | Out-Null
          Invoke-WebRequest "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip" -OutFile extras\sumatra.zip
          Expand-Archive extras\sumatra.zip -DestinationPath extras\unz -Force
          Copy-Item (Get-ChildItem extras\unz -Filter "SumatraPDF*.exe" | Select-Object -First 1).FullName extras\SumatraPDF.exe

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\labdesk.iss

      - name: Write the installer's checksum (the program checks it before installing an update)
        shell: pwsh
        run: |
          Get-ChildItem dist\LabDesk-Setup-*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: LabDesk-Setup-${{ steps.ver.outputs.version }}
          path: dist/LabDesk-Setup-*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/LabDesk-Setup-*.exe dist/LabDesk-Setup-*.exe.sha256 --title "LabDesk ${{ steps.ver.outputs.version }}" --generate-notes

      # The program looks for updates in a separate PUBLIC repository that holds only installers
      # (no source code). Create it once (mstudio005/labdesk-releases) and add a secret named
      # RELEASES_TOKEN: a token that can write releases to that repository. Without the secret this
      # step is skipped and the release above still works.
      - name: Publish the update for installed copies
        if: startsWith(github.ref, 'refs/tags/v') && env.RELEASES_TOKEN != ''
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/LabDesk-Setup-*.exe dist/LabDesk-Setup-*.exe.sha256 --repo mstudio005/labdesk-releases --title "LabDesk ${{ steps.ver.outputs.version }}" --notes "LabDesk ${{ steps.ver.outputs.version }}"
